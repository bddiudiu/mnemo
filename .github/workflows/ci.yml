name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check memori/ tests/

      - name: Format check with black
        run: |
          black --check memori/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t memori .
      - name: Verify health
        run: |
          docker run -d -p 8080:8080 --name memori-test memori
          sleep 5
          curl -f http://localhost:8080/api/v1/health
          docker stop memori-test
