[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemo"
version = "0.1.0"
description = "Agent Memory Middleware — Give your AI agents persistent memory across sessions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "memori contributors"}
]
keywords = ["ai", "agent", "memory", "llm", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0",
    "networkx>=3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.0",
    "ruff>=0.5.0",
]
openai = ["openai>=1.0"]
local = ["sentence-transformers>=3.0"]
all = ["memori[openai,local,dev]"]

[project.scripts]
memori = "memori.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["memori"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
